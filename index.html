<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-version" content="dev">
  <title>กินดี · สั่งอาหาร</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #f4f6f8; color: #16212e; }
    header { background: #0b6e8a; color: #fff; padding: 16px; border-radius: 12px; }
    h1 { margin: 0; font-size: 1.6rem; }
    .item { display: flex; justify-content: space-between; background: #fff; padding: 12px 16px; border-radius: 8px; margin-top: 8px; }
    #pay-button { margin-top: 16px; width: 100%; padding: 14px; font-size: 1.1rem; border: none; border-radius: 8px; background: #1d7a46; color: #fff; }
    footer { margin-top: 16px; font-size: .8rem; color: #566476; }
  </style>
</head>
<body>
  <header>
    <h1>กินดี</h1>
    <!-- ภารกิจ 1: เปลี่ยนข้อความต้อนรับบรรทัดนี้เป็นชื่อของตัวเอง -->
    <p id="welcome">ยินดีต้อนรับสู่โรงอาหาร</p>
  </header>

  <div id="menu"></div>

  <!-- ปุ่มนี้สำคัญมาก ถ้าหายไป ลูกค้าจะจ่ายเงินไม่ได้ -->
  <button id="pay-button" type="button">จ่ายด้วย QR</button>

  <footer>เวอร์ชัน <span id="version"></span></footer>

  <script src="menu.js"></script>
  <script>
    document.getElementById("menu").innerHTML = MENU
      .map(m => `<div class="item"><span>${m.name}</span><b>${m.price} บาท</b></div>`)
      .join("");
    document.getElementById("version").textContent =
      document.querySelector('meta[name="app-version"]').content.slice(0, 7);
  </script>
</body>
</html>
